<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ulabase Shop</title>
    <!--
      What a link preview shows.

      Every crawler that does not run JavaScript — Slack, WhatsApp, X, LinkedIn — sees only this
      file, so a product link pasted into a chat gets these words and not the product's. That is
      the price of a single-page app, and the reason these are written to be true of the whole
      shop rather than left as a placeholder. Replace them with your own; see NOTES.md for what
      server-side rendering would change.
    -->
    <meta name="description" content="A small shop built on Ulabase." />
    <meta property="og:site_name" content="Ulabase Shop" />
    <meta property="og:title" content="Ulabase Shop" />
    <meta property="og:description" content="A small shop built on Ulabase." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
